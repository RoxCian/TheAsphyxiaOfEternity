@if (service.canReturnToTop()) {
    <button bungFloatButton class="return-to-top" registeredAs="returnToTop" (click)="service.returnToTop()">
        <span class="heading" [class.hide]="isMobile()">Return</span>
        <span class="to-top">
            @if (isMobile()) {
                <i class="mdi mdi-arrow-up-thick"></i>
            } @else { Top }
        </span>
    </button>
}
