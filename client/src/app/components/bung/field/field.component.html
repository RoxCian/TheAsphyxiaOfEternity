<div class="field-label is-normal">
    <label class="label" [class.is-dirty]="formField()?.()?.dirty() || isDirty()">
        @if (formField()?.()?.required()) { * }
        <bung-insertion [content]="label()" [context]="labelContext()" />
    </label>
</div>
<div class="field-body">
    <div class="control">
        <ng-content />
        @if (help()) {
            <p class="help first-help">
                <bung-insertion [content]="help()" [context]="helpContext()" />
            </p>
        }
        @for (error of formField()?.()?.errors(); let i = $index; track error.fieldTree()) {
            @if (error && error.message) {
                <p class="help is-danger" [class.first-help]="!help() && i === 0">{{ error.message }}</p>
            }
        }
    </div>
</div>
